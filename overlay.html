<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #stage { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; }
      #stage.go { animation: shake 0.5s 0.15s linear 3; }

      /* White flash on impact */
      #flash { position: fixed; inset: 0; background: #fff; opacity: 0; }
      .go #flash { animation: flash 0.45s 0.12s ease-out; }

      /* Spinning sun rays */
      #rays {
        position: absolute; width: 180vmax; height: 180vmax; border-radius: 50%; opacity: 0;
        background: repeating-conic-gradient(rgba(255, 230, 0, .55) 0 9deg, rgba(255, 60, 0, .0) 9deg 18deg);
        -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 55%);
                mask: radial-gradient(circle, #000 0 20%, transparent 55%);
      }
      .go #rays { animation: rays 4s linear forwards; }

      #meme { position: relative; display: grid; place-items: center; transform: scale(0); }
      .go #meme { animation: slam 4s cubic-bezier(.2, .9, .3, 1.3) forwards; }

      #pop {
        width: min(55vw, 55vh); max-height: 70vh; object-fit: contain;
        filter: saturate(3) contrast(1.6) brightness(1.1) drop-shadow(0 0 30px #ff0);
      }
      .go #pop { animation: fry 0.25s steps(2) infinite; }

      .caption {
        position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
        font-family: Impact, "Anton", "Arial Black", sans-serif; text-transform: uppercase;
        font-size: min(6.5vw, 10vh); line-height: 1; color: #fff; letter-spacing: .02em;
        -webkit-text-stroke: max(2px, .06em) #000; paint-order: stroke fill;
        text-shadow: 0 .05em 0 #000, 0 0 .3em rgba(0,0,0,.6);
      }
      #top { top: -0.55em; }
      #bottom { bottom: -0.55em; }
      .go .caption { animation: wobble .3s ease-in-out infinite alternate; }

      .particle { position: fixed; left: 50%; top: 50%; font-size: 6vmin; will-change: transform, opacity; }

      @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
      @keyframes shake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        10% { transform: translate(-2.5%, 1.5%) rotate(-1.5deg); }
        30% { transform: translate(2%, -2%) rotate(1.5deg); }
        50% { transform: translate(-1.5%, 2%) rotate(-1deg); }
        70% { transform: translate(2%, 1%) rotate(1deg); }
        90% { transform: translate(-1%, -1.5%) rotate(-.5deg); }
      }
      @keyframes rays {
        0% { opacity: 0; transform: rotate(0); }
        8%, 80% { opacity: 1; }
        100% { opacity: 0; transform: rotate(160deg); }
      }
      /* Slam in from huge, hold, then spin off into the distance */
      @keyframes slam {
        0%   { transform: scale(5) rotate(-25deg); opacity: 0; }
        4%   { opacity: 1; }
        10%  { transform: scale(.85) rotate(6deg); }
        16%  { transform: scale(1.12) rotate(-4deg); }
        22%  { transform: scale(1) rotate(2deg); }
        80%  { transform: scale(1.06) rotate(-2deg); opacity: 1; }
        100% { transform: scale(0) rotate(900deg); opacity: 0; }
      }
      @keyframes fry {
        0% { filter: saturate(3) contrast(1.6) brightness(1.1) hue-rotate(0deg) drop-shadow(0 0 30px #ff0); }
        100% { filter: saturate(4) contrast(1.9) brightness(1.2) hue-rotate(25deg) drop-shadow(0 0 40px #f0f); }
      }
      @keyframes wobble {
        from { transform: translateX(-50%) rotate(-3deg) scale(1); }
        to   { transform: translateX(-50%) rotate(3deg) scale(1.08); }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="rays"></div>
      <div id="meme">
        <img id="pop" alt="" />
        <div id="top" class="caption"></div>
        <div id="bottom" class="caption"></div>
      </div>
      <div id="flash"></div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
